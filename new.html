<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heart Disease Prediction</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.card {
  border: 2px solid #fff;
  background: #ffffffdd;
  backdrop-filter: blur(10px);
}

button {
  transition: transform 0.2s ease-in-out;
}

button:hover {
  transform: scale(1.05);
}

#result {
  font-size: 1.4rem;
  color: #d63384;
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-4 animate__animated animate__fadeInDown">
      <h2 class="text-center mb-4">❤️ Heart Disease Prediction</h2>
      <form id="predictionForm">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Age</label>
            <input type="number" class="form-control" name="age" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Sex (1=Male, 0=Female)</label>
            <input type="number" class="form-control" name="sex" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Chest Pain Type (cp)</label>
            <input type="number" class="form-control" name="cp" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Resting BP</label>
            <input type="number" class="form-control" name="trestbps" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Cholesterol</label>
            <input type="number" class="form-control" name="chol" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Fasting Blood Sugar</label>
            <input type="number" class="form-control" name="fbs" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Resting ECG</label>
            <input type="number" class="form-control" name="restecg" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Max Heart Rate</label>
            <input type="number" class="form-control" name="thalach" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Exercise Angina</label>
            <input type="number" class="form-control" name="exang" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Oldpeak</label>
            <input type="number" step="0.1" class="form-control" name="oldpeak" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Slope</label>
            <input type="number" class="form-control" name="slope" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>CA</label>
            <input type="number" class="form-control" name="ca" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Thal</label>
            <input type="number" class="form-control" name="thal" required>
          </div>
        </div>
        <button type="submit" class="btn btn-danger w-100 mt-3">Predict</button>
      </form>
      <div id="result" class="mt-4 text-center fw-bold"></div>
    </div>
  </div>

  <script>
    document.getElementById("predictionForm").addEventListener("submit", async function(e){
      e.preventDefault();

      let formData = {};
      new FormData(this).forEach((value, key) => formData[key] = Number(value));

      const response = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(formData)
      });

      const result = await response.json();
      // Show SweetAlert popup
        if(result.prediction === 1){
          Swal.fire({
            title: 'Warning!',
            text: 'Heart Disease Detected!',
            icon: 'error',
            confirmButtonText: 'Ok'
          });
        } else {
          Swal.fire({
            title: 'Good News!',
            text: 'No Heart Disease Detected',
            icon: 'success',
            confirmButtonText: 'Ok'
          });
        }
    });
  </script>
</body>
</html>
